# Production requires explicit secrets and a public DNS name for automatic HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: krajanek
      POSTGRES_USER: krajanek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krajanek -d krajanek"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # HOST/PORT napevno: Caddy i healthcheck počítají s backend:3001 (Coolify si jinak může vnutit vlastní PORT)
      HOST: 0.0.0.0
      PORT: "3001"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: krajanek
      PGUSER: krajanek
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      CHECKIN_SECONDS: "60"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
      ADMIN_MUST_CHANGE: "1"
      ADMIN_RESET: ${ADMIN_RESET:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TRUSTED_PROXIES: "172.30.57.10"
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-5}
      MAX_PLAYERS: ${MAX_PLAYERS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public HTTPS hostname}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.57.10

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.57.0/24
