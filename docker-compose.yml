# Krajánek: docker compose up -d --build
# Jediné, co je potřeba nastavit: PORT = port na serveru pro přístup zvenku (výchozí 8080).
# HTTPS řeší proxy před serverem (Coolify / Traefik / nginx). Ostatní volitelné viz .env.example.
# Data (účty, body, sezóny) zůstávají v Postgresu i po restartu.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: krajanek
      POSTGRES_USER: krajanek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krajanek}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krajanek -d krajanek"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # HOST/PORT napevno: Caddy i healthcheck počítají s backend:3001 (Coolify si jinak může vnutit vlastní PORT)
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: postgres://krajanek:${POSTGRES_PASSWORD:-krajanek}@db:5432/krajanek
      CHECKIN_SECONDS: ${CHECKIN_SECONDS:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_MUST_CHANGE: ${ADMIN_MUST_CHANGE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"

volumes:
  db-data:
